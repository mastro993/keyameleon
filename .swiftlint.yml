swiftlint_version: "0.65.1"
strict: true

included:
  - Sources

file_length:
  warning: 1000
  error: 1200
type_body_length:
  warning: 800
  error: 1000
function_body_length:
  warning: 120
  error: 150

type_name:
  max_length:
    warning: 60
    error: 80
identifier_name:
  max_length:
    warning: 60
    error: 80

cyclomatic_complexity:
  ignores_case_statements: true
