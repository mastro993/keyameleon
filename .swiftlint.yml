swiftlint_version: "0.65.1"
strict: true

included:
  - Sources

file_length:
  warning: 1000
  error: 1200
type_body_length:
  warning: 800
  error: 1000
function_body_length:
  warning: 120
  error: 150

type_name:
  max_length:
    warning: 60
    error: 80
identifier_name:
  max_length:
    warning: 60
    error: 80

cyclomatic_complexity:
  ignores_case_statements: true

# Product and style invariants that agents copy from generic SwiftUI templates.
# Keep these in lockstep with Tests/Scripts/test_source_policy.py.
# match_kinds limits each rule to executable syntax so comments and strings
# that name a banned API do not fail the strict lint.
custom_rules:
  no_observable_object:
    name: "No ObservableObject"
    regex: "ObservableObject|@Published|@StateObject|@ObservedObject|@EnvironmentObject"
    match_kinds:
      - identifier
      - typeidentifier
      - attribute.builtin
      - attribute.id
    message: "Use an @Observable class with @State, @Bindable, or @Environment."
    severity: error

  no_gcd:
    name: "No GCD"
    regex: "\\bDispatchQueue\\b"
    match_kinds:
      - identifier
      - typeidentifier
    message: "Use Swift concurrency instead of DispatchQueue."
    severity: error

  no_task_sleep_nanoseconds:
    name: "No Task.sleep(nanoseconds:)"
    regex: "Task\\.sleep\\(nanoseconds:"
    match_kinds:
      - identifier
    message: "Use Task.sleep(for:) instead of Task.sleep(nanoseconds:)."
    severity: error

  no_legacy_formatter:
    name: "No legacy Formatter"
    regex: "\\b(DateFormatter|NumberFormatter|MeasurementFormatter)\\b"
    match_kinds:
      - identifier
      - typeidentifier
    message: "Use FormatStyle instead of Formatter subclasses."
    severity: error

  no_string_format:
    name: "No String(format:)"
    regex: "String\\(\\s*format:"
    match_kinds:
      - identifier
    message: "Use FormatStyle, or String(_:radix:) for hex, instead of C-style String(format:)."
    severity: error

  no_replacing_occurrences:
    name: "No replacingOccurrences"
    regex: "replacingOccurrences\\("
    match_kinds:
      - identifier
    message: "Use replacing(_:with:) instead of replacingOccurrences(of:with:)."
    severity: error

  no_foreground_color:
    name: "No foregroundColor"
    regex: "\\.foregroundColor\\("
    match_kinds:
      - identifier
    message: "Use foregroundStyle() instead of foregroundColor()."
    severity: error

  no_swiftui_picker:
    name: "No SwiftUI Picker"
    included: "Sources/Features/(Configuration|Onboarding|Shared|AppAssignments)/.*\\.swift"
    regex: "(?<![A-Za-z0-9_])Picker\\s*\\("
    match_kinds:
      - identifier
      - typeidentifier
    message: "SwiftUI Picker in a grouped Form hides the System Settings pop-up box at rest on macOS 26. Use PopUpPicker."
    severity: error

  no_navigation_view:
    name: "No NavigationView"
    regex: "\\bNavigationView\\b"
    match_kinds:
      - identifier
      - typeidentifier
    message: "Use NavigationStack instead of NavigationView."
    severity: error

  no_tab_item:
    name: "No tabItem"
    regex: "\\.tabItem\\s*(\\(|\\{)"
    match_kinds:
      - identifier
    message: "Use the Tab API instead of tabItem()."
    severity: error

  no_nsscreen_main:
    name: "No NSScreen.main"
    regex: "NSScreen\\.main"
    match_kinds:
      - identifier
      - typeidentifier
    message: "Do not use NSScreen.main to read available space."
    severity: error

  no_cfarray_get_value:
    name: "No CFArrayGetValueAtIndex"
    regex: "CFArrayGetValueAtIndex"
    match_kinds:
      - identifier
    message: "Bridge CF arrays to Swift arrays so elements stay owned. CFArrayGetValueAtIndex caused a use-after-free in optimized builds."
    severity: error
