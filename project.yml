name: Keyameleon

options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
      buildPhase: resources

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

configFiles:
  Debug: Config/Development.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # User-facing strings live in Resources/Localization/Localizable.xcstrings and are
    # referenced through generated symbols, such as `Text(.settings)`.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    # Official Release commits MARKETING_VERSION, then verifies both values from its tag.
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: $(KEYAMELEON_DEVELOPMENT_SIGNING_IDENTITY)
      CODE_SIGNING_REQUIRED: YES

targets:
  Keyameleon:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/Onboarding.xcassets
        type: file
        buildPhase: resources
      - path: Keyameleon-icon.icon
        type: file
        buildPhase: resources
      - path: Resources/menu_icon.pdf
        type: file
        buildPhase: resources
      - path: Resources/Localization
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Keyameleon-icon
        PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon
        PRODUCT_NAME: Keyameleon
        PRODUCT_MODULE_NAME: Keyameleon
        EXECUTABLE_NAME: Keyameleon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSInputMonitoringUsageDescription: Keyameleon observes Activation Activity from each Physical Keyboard so Activity-Triggered Switching can select the assigned Input Source.
      configs:
        # Debug is its own app to macOS: Input Monitoring row, defaults domain,
        # data and logs (docs/adr/0008-separate-debug-identity.md). Its bundle is
        # Keyameleon (Dev).app, so System Settings and Finder can tell it apart;
        # the module and executable stay Keyameleon.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon.debug
          PRODUCT_NAME: Keyameleon (Dev)
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSInputMonitoringUsageDescription: Keyameleon observes Activation Activity from each Physical Keyboard so Activity-Triggered Switching can select the assigned Input Source.
        # Sparkle 2: user-approved, 24h-bounded checks; no auto-install; no system profiling.
        SUFeedURL: https://mastro993.github.io/keyameleon/appcast.xml
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
    postBuildScripts:
      - name: Bundle licenses and notices
        script: |
          python3 "${SRCROOT}/Scripts/bundle-licenses.py" \
            --app "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" \
            --build-dir "${BUILD_DIR}" --copy
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Sparkle
        product: Sparkle
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreHID.framework
      - sdk: CryptoKit.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: SwiftData.framework
      - sdk: SwiftUI.framework

  KeyameleonSwiftTesting:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SwiftTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon.tests.swift-testing
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Keyameleon (Dev).app/Contents/MacOS/Keyameleon
    dependencies:
      - target: Keyameleon

  KeyameleonXCTest:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/XCTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon.tests.xctest
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Keyameleon (Dev).app/Contents/MacOS/Keyameleon
    dependencies:
      - target: Keyameleon

schemes:
  Keyameleon:
    build:
      targets:
        Keyameleon: all
        KeyameleonSwiftTesting: [test]
        KeyameleonXCTest: [test]
    test:
      # Tests assert English copy, whatever language the Mac runs in.
      language: en
      region: US
      targets:
        - KeyameleonSwiftTesting
        - KeyameleonXCTest
