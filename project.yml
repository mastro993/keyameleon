name: Keyameleon

options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    # Official Release overrides these from the vMAJOR.MINOR.PATCH tag.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Keyameleon:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon
        PRODUCT_NAME: Keyameleon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Keyameleon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSInputMonitoringUsageDescription: Keyameleon observes Activation Activity from each Physical Keyboard so Activity-Triggered Switching can select the assigned Input Source.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon.development
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Keyameleon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMultipleInstancesProhibited: true
        NSInputMonitoringUsageDescription: Keyameleon observes Activation Activity from each Physical Keyboard so Activity-Triggered Switching can select the assigned Input Source.
        # Sparkle 2: user-approved, 24h-bounded checks; no auto-install; no system profiling.
        SUFeedURL: https://github.com/mastro993/Keyameleon/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
    dependencies:
      - package: Sparkle
        product: Sparkle
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreHID.framework
      - sdk: CryptoKit.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: SwiftData.framework
      - sdk: SwiftUI.framework
      - sdk: UserNotifications.framework

  KeyameleonSwiftTesting:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/SwiftTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon.tests.swift-testing
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Keyameleon

  KeyameleonXCTest:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/XCTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon.tests.xctest
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Keyameleon

  KeyameleonUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fedemas.keyameleon.tests.ui
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Keyameleon

schemes:
  Keyameleon:
    build:
      targets:
        Keyameleon: all
        KeyameleonSwiftTesting: [test]
        KeyameleonXCTest: [test]
        KeyameleonUITests: [test]
    test:
      targets:
        - KeyameleonSwiftTesting
        - KeyameleonXCTest
        - KeyameleonUITests
