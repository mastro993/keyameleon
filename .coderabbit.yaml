# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration for Keyameleon.
# Product vocabulary: CONTEXT.md. Behavior and its reasons: docs/choices.md and docs/adr.
# Reference: https://docs.coderabbit.ai/reference/configuration

language: en-US
tone_instructions: >-
  Be direct and specific. Lead with correctness, privacy, and concurrency risks. Skip praise and
  style nits that SwiftLint already enforces. Use the CONTEXT.md glossary terms for domain concepts.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Summarize the user-visible effect first, in plain language, using the CONTEXT.md terms
    (Physical Keyboard, Input Source, Keyboard Assignment, Activity-Triggered Switching, Switching Status,
    Guided setup, Settings, menu bar menu). Then list internal changes in short bullets.
    Call out explicitly, when present: changes to persisted data (SwiftData schema, UserDefaults keys,
    Keychain items), Input Monitoring permission flow, logging, Sparkle update behavior, and the release
    pipeline.
  auto_title_instructions: |
    Use a Conventional Commit title in plain language, lowercase type, optional scope, no trailing period,
    describing the user-visible outcome, for example `fix(menu): keep scroll position when a keyboard reconnects`.
    Common scopes: app, switching, keyboards, menu, settings, onboarding, setup, updates, persistence, logging,
    release, ci, scripts, docs, readme.
  review_status: true
  review_details: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  in_progress_fortune: false

  suggested_labels: true
  auto_apply_labels: false
  labeling_instructions:
    - label: bug
      instructions: Apply when the PR fixes incorrect behavior (a `fix` title or a linked bug report).
    - label: enhancement
      instructions: Apply when the PR adds or changes user-visible behavior (a `feat` title or a linked feature request).
    - label: documentation
      instructions: Apply when the PR changes only Markdown documentation, ADRs, README, or repository guidance files.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    # Vendored agent skills, pinned by skills-lock.json; not product code.
    - "!.agents/**"
    # Generated by XcodeGen from project.yml; review project.yml instead.
    - "!Keyameleon.xcodeproj/project.pbxproj"
    - "!Keyameleon.xcodeproj/project.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings"
    # Binary design sources, artwork, and screenshots.
    - "!design/**"
    - "!assets/**"
    - "!Keyameleon-icon.icon/Assets/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.webp"
    - "!**/*.pdf"
    - "!**/*.pyc"
    - "!**/__pycache__/**"
    - "!build/**"

  path_instructions:
    - path: "**/*"
      instructions: |
        Keyameleon is a macOS 26 menu bar app (Swift 6, AppKit + SwiftUI + SwiftData, Sparkle for updates).
        It observes keyboards through CoreHID in listen-only mode and selects the Input Source assigned to the
        Physical Keyboard that produced Activation Activity. Treat these as hard failures in any file:
        - Monitor-only: never seize, inject, tap, or alter input. No `CGEvent*` taps or posting, `IOHIDPostEvent`,
          virtual HID devices, or private `CGS*` symbols. Layout changes go only through the Text Input Sources API.
        - Key Content (key transitions, modifiers, shortcuts, interpreted text, Physical Keyboard State, raw
          reports) never reaches saved data, the Log File, network output, or crash state.
        - No telemetry, analytics, crash upload, or networking. Sparkle update checks are the only network traffic.
        - Nothing silent or substituted: never pick a replacement Input Source, never delete or recreate unreadable
          user data, never move saved data between changed identities without an explicit rule or user action.
        - No new third-party dependency without an agreed issue.
        - No signing certificates, notarization credentials, Sparkle private keys, or recovery material.
        If a change contradicts docs/choices.md or an ADR in docs/adr, name the conflict instead of accepting it.
        If behavior changes, the matching section of docs/choices.md, docs/testing.md, or docs/development.md
        must change in the same PR.

    - path: "Tests/SwiftTesting/**/*.swift"
      instructions: |
        Swift Testing for domain and model seams (`@Test`, `#expect`, `#require`). Each test protects one
        user-visible outcome or one critical safety rule. Flag tests of private counters or wiring, fixed sleeps
        or timing assumptions, and anything that touches the real Logs folder, real SwiftData store, Keychain, or
        System Settings. Tests must use in-memory or disposable storage and injected side effects. Test names use
        the CONTEXT.md vocabulary.

    - path: "Tests/XCTest/**/*.swift"
      instructions: |
        XCTest is only for AppKit shell contracts. Suggest Swift Testing for domain logic. There is no UI-test
        target; do not suggest adding one.

    - path: "Tests/Scripts/**/*.py"
      instructions: |
        Python tests for CI and release tooling. They must not hit the network, real signing identities, or the
        user's home directory. Prefer temporary directories and explicit fixtures.

    - path: "Scripts/**/*.py"
      instructions: |
        Release and build tooling. Check exact validation (version tags, appcast items, license bundling, EdDSA
        keys) with clear failure messages and nonzero exit codes. Behavior changes need a matching test in
        Tests/Scripts.

    - path: ".github/workflows/**"
      instructions: |
        `CI` must keep one stable required check, `Required CI gate`; do not make the conditional
        `Build and test` job required, and do not require `Source policy` separately — the gate already
        depends on it. When build-affecting paths change, the `Check whether code changed` list
        must be updated. SwiftLint version and SHA-256 must match in `ci.yml`, `release.yml`, and `.swiftlint.yml`.
        The Release workflow runs only from `workflow_dispatch` on `main` (ADR 0004). Check least-privilege
        `permissions`, pinned actions, no secret exposure to pull requests from forks, and no untrusted input
        interpolated into `run` steps.

    - path: "project.yml"
      instructions: |
        Source of truth for the XcodeGen project. Keep macOS 26.0, Swift 6, complete strict concurrency, warnings
        as errors, and hardened runtime. `MARKETING_VERSION` is changed only by the Release workflow. Flag new
        package dependencies (only Sparkle is approved) and signing identities or team IDs committed in plain text.

    - path: "Keyameleon.xcodeproj/**/Package.resolved"
      instructions: |
        Flag any new package. Sparkle version changes need a link to its release notes and a note on updater
        compatibility.

    - path: "**/*.md"
      instructions: |
        Docs describe current behavior, edited in place; do not suggest dated changelog entries (there is no
        CHANGELOG.md). Check that statements match the code in the same PR, that links and anchors resolve, and
        that domain terms follow CONTEXT.md (Physical Keyboard, not "device"; Keyboard Assignment, not "mapping").
        Keep plain, short sentences. Ignore line length.

    - path: "CONTEXT.md"
      instructions: |
        Glossary of product terms. A new or changed term must define one concept, list the synonyms to avoid,
        and not conflict with existing terms or ADRs.

    - path: "docs/adr/**"
      instructions: |
        ADRs record decisions. Do not edit an accepted decision silently; a reversal needs a new ADR that
        supersedes the old one.

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: |
        Conventional Commit format `type(scope): summary` or `type: summary`, where type is one of feat, fix,
        perf, refactor, test, docs, ci, build, or chore. The summary is plain language, lowercase, without a
        trailing period, and describes the outcome rather than the implementation.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Monitor-only input
        mode: error
        instructions: |
          Fail if the PR adds code under Sources that seizes, injects, taps, posts, or alters keyboard input:
          `CGEvent` taps or posting, `IOHIDPostEvent`, virtual HID devices, seize options on CoreHID or IOHID
          managers, or private `CGS*` symbols. Fail if it changes the Input Source by any API other than the Text
          Input Sources API. Pass otherwise.
      - name: Key Content privacy
        mode: error
        instructions: |
          Fail if any added or changed code can write Key Content (key transitions, key codes, modifiers,
          shortcuts, interpreted text, Physical Keyboard State, or raw HID reports) to SwiftData, UserDefaults,
          the Keychain, files, the Log File, network requests, or crash state. Also fail if a log line includes a
          Physical Keyboard Identity value, a file path, or system error text. Pass otherwise.
      - name: No telemetry or new dependencies
        mode: error
        instructions: |
          Fail if the PR adds analytics, telemetry, crash reporting, or any network request other than Sparkle's
          update check; no exception applies. Also fail if the PR adds a Swift package or other third-party
          dependency, unless the PR description links an issue where that dependency was agreed. Pass otherwise.
      - name: Tests for behavior changes
        mode: warning
        instructions: |
          If the PR changes behavior in Sources or Scripts, it must add or update a test in Tests/SwiftTesting,
          Tests/XCTest, or Tests/Scripts that would fail without the change, or the description must explain why
          only manual verification is possible and list the manual steps. Pure refactors, documentation, and
          copy-only changes pass.
      - name: Docs match behavior
        mode: warning
        instructions: |
          If the PR changes user-visible behavior, persisted data, permissions, logging, updates, CI, or the
          release process, the section of docs/choices.md, docs/testing.md, docs/development.md, or
          docs/release/ that describes it must be updated in the same PR. Pass when no
          documented behavior changed.
      - name: UI change evidence
        mode: warning
        instructions: |
          If the PR changes SwiftUI views, AppKit windows, menus, or visual assets, the description must include
          before and after images, or a short video for motion or timing changes. Pass when the PR has no UI
          changes.

  tools:
    swiftlint:
      enabled: true
      config_file: .swiftlint.yml
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    # Default yamllint rules (80-column lines, document start) flag every existing workflow.
    yamllint:
      enabled: false
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    ast-grep:
      essential_rules: true
    github-checks:
      enabled: true
    # Docs use long lines and plain prose; path instructions cover them instead.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

chat:
  auto_reply: true
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - CONTEXT.md
      - CONTRIBUTING.md
      - docs/choices.md
      - docs/testing.md
      - docs/development.md
      - "docs/adr/*.md"
      - "docs/choices/*.md"
      - "docs/testing/*.md"
      # Per-path review guidelines moved out of reviews.path_instructions.
      - files: docs/review/swift-sources.md
        applyTo: "Sources/**/*.swift"
      - files: docs/review/activity-triggered-switching.md
        applyTo: "Sources/Features/ActivityTriggeredSwitching/**"
      - files: docs/review/persistence.md
        applyTo: "Sources/**/*{Store,Persistence,SavedPhysicalKeyboardChange}*.swift"
      - files: docs/review/logging.md
        applyTo: "Sources/Features/Shared/Log*.swift"
      - files: docs/review/menu-bar-menu.md
        applyTo: "Sources/Features/Menu/**"
      - files: docs/review/guided-setup.md
        applyTo: "Sources/Features/Onboarding/**"
      - files: docs/review/updates.md
        applyTo: "Sources/Features/About/**"
      - files: docs/review/app-shell.md
        applyTo: "Sources/App/**"
      - files: docs/review/shell-scripts.md
        applyTo: "Scripts/**/*.sh"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    path_instructions:
      - path: "**/*.swift"
        instructions: |
          Use `///` Swift documentation comments. Document intent, invariants, and failure behavior, not what
          the signature already says. Use CONTEXT.md terms. Skip trivial SwiftUI `body` properties and previews.
  unit_tests:
    path_instructions:
      - path: "**/*.swift"
        instructions: |
          Write Swift Testing tests (`import Testing`, `@Test`, `#expect`, `#require`) under Tests/SwiftTesting,
          mirroring the feature folder of the code under test. One user-visible outcome or safety rule per test.
          Use in-memory SwiftData and injected fakes; never touch real storage, Logs, Keychain, CoreHID, or
          System Settings. No sleeps or fixed timing. Do not test private state.
      - path: "Scripts/**/*.py"
        instructions: |
          Write Python `unittest` tests under Tests/Scripts with temporary directories and no network access.
