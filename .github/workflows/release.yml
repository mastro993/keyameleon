name: Release

# Only workflow_dispatch on the default branch starts an Official Release.
# The annotated tag is created after artifacts exist. A tag push does not publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic Versioning core (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Official Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require default branch
        run: |
          set -euo pipefail
          default="${{ github.event.repository.default_branch }}"
          if [[ "${{ github.ref_name }}" != "${default}" ]]; then
            echo "Official Release only from ${default}; got ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Reject used or invalid Official Release version
        id: version
        run: |
          set -euo pipefail
          chmod +x Scripts/*.sh
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          ./Scripts/verify-official-release-tag.sh "$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/wait-for-ci.sh "${{ github.sha }}"

  produce:
    name: Produce Official Release artifacts
    needs: verify
    runs-on: macos-26
    environment: official-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject published Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Produce signed, notarized, stapled artifacts
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          chmod +x Scripts/*.sh
          if [[ -z "${CODESIGN_IDENTITY}" ]]; then
            unset CODESIGN_IDENTITY
          fi
          ./Scripts/official-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-release-${{ needs.verify.outputs.version }}
          path: dist/release-evidence.json
          if-no-files-found: error

      - name: Prepare Official Release tag and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x Scripts/*.sh
          # The notes script excludes TAG if this job is resuming after the tag
          # was created but before the GitHub Release was published.
          CHANGES="$(./Scripts/official-release-notes.sh --tag "$TAG")"
          printf '%s\n' "$CHANGES" >"$RUNNER_TEMP/release-notes.md"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Keyameleon ${VERSION}"
            git push origin "$TAG"
          fi

      - name: Stage Sparkle appcast for GitHub Pages
        run: |
          set -euo pipefail
          mkdir -p public
          cp dist/appcast.xml public/appcast.xml

      - name: Publish Sparkle appcast to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true

      # Publish last. If Pages fails, rerunning this job can reuse the tag and
      # try Pages again without an existing GitHub Release blocking recovery.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi

          gh release create "$TAG" \
            "dist/Keyameleon-${VERSION}.dmg" \
            --title "Keyameleon ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
