name: Release

# Only workflow_dispatch on the default branch starts an Official Release.
# One protected job tests, signs, and saves the release artifacts. Only then
# does it push the version commit and annotated tag and publish. A tag push
# does not publish.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Official Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_name }}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Official Release only from ${DEFAULT_BRANCH}; got ${{ github.ref_name }}" >&2
            exit 1
          fi
          git fetch origin "${DEFAULT_BRANCH}"
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ "${DISPATCH_SHA}" != "${remote_sha}" ]]; then
            echo "main advanced after dispatch: expected ${DISPATCH_SHA}, got ${remote_sha}" >&2
            exit 1
          fi

      - name: Calculate next Official Release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          VERSION="$(python3 Scripts/release-version.py "${RELEASE_TYPE}")"
          TAG="v${VERSION}"
          ./Scripts/verify-official-release-tag.sh "$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # Required reviewers approve each job that references the environment, so
  # every protected stage runs here, in order, after one approval.
  release:
    name: Official Release
    needs: verify
    runs-on: macos-26
    environment: official-release
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare version commit
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' Keyameleon.xcodeproj/project.pbxproj project.yml | sort)"
          expected_subject="chore(release): ${VERSION}"
          git fetch origin "${DEFAULT_BRANCH}"
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"

          if [[ "${remote_sha}" != "${SOURCE_SHA}" ]]; then
            remote_parent="$(git log -1 --format=%P "${remote_sha}")"
            remote_subject="$(git log -1 --format=%s "${remote_sha}")"
            remote_files="$(git diff-tree --no-commit-id --name-only -r "${remote_sha}" | sort)"
            remote_version="$(git show "${remote_sha}:project.yml" | sed -n 's/^    MARKETING_VERSION: "\(.*\)"$/\1/p')"
            if [[ "${remote_parent}" == "${SOURCE_SHA}" && \
                  "${remote_subject}" == "${expected_subject}" && \
                  "${remote_files}" == "${expected_files}" && \
                  "${remote_version}" == "${VERSION}" ]]; then
              git checkout --detach "${remote_sha}"
              echo "commit=${remote_sha}" >> "$GITHUB_OUTPUT"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main changed before the release bump; dispatch again from current main" >&2
            exit 1
          fi

          calculated="$(python3 Scripts/release-version.py "${RELEASE_TYPE}" --write)"
          if [[ "${calculated}" != "${VERSION}" ]]; then
            echo "release version changed: expected ${VERSION}, got ${calculated}" >&2
            exit 1
          fi

          xcodegen generate --spec project.yml
          git diff --check
          changed_files="$(git diff --name-only | sort)"
          if [[ "${changed_files}" != "${expected_files}" ]]; then
            echo "unexpected release-bump files:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          fi

          # Saved artifacts name this commit before it reaches main. Fixed
          # metadata lets a retry recreate the same commit from the same source.
          source_date="$(git log -1 --format=%cI "${SOURCE_SHA}")"
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          export GIT_AUTHOR_DATE="${source_date}" GIT_COMMITTER_DATE="${source_date}"
          git add project.yml Keyameleon.xcodeproj/project.pbxproj
          git commit -m "${expected_subject}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pushed=false" >> "$GITHUB_OUTPUT"

      - name: Restore saved release artifacts on retry
        id: saved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          artifact_name="official-release-${VERSION}"
          artifact_id="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | jq -r --arg name "${artifact_name}" '[.[].artifacts[] | select(.name == $name)] |
              if length == 0 then ""
              elif length != 1 or .[0].expired then error("saved release artifact is ambiguous or expired")
              else .[0].id end')"
          if [[ -n "${artifact_id}" ]]; then
            gh run download "${GITHUB_RUN_ID}" --name "${artifact_name}" --dir dist
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}")"
            test -z "${remote_tag}"
            release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.tag_name == "'"${TAG}"'") | .id')"
            test -z "${release_id}"
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SwiftLint 0.65.1
        if: steps.saved.outputs.restored != 'true'
        run: |
          set -euo pipefail
          swiftlint_dir="${RUNNER_TEMP}/swiftlint"
          mkdir -p "${swiftlint_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            -o "${swiftlint_dir}/swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  ${swiftlint_dir}/swiftlint.zip" \
            | shasum -a 256 --check
          unzip -q "${swiftlint_dir}/swiftlint.zip" -d "${swiftlint_dir}"
          echo "${swiftlint_dir}" >> "${GITHUB_PATH}"

      - name: Test version commit
        if: steps.saved.outputs.restored != 'true'
        run: |
          ./Scripts/run.sh test
          git diff --exit-code

      - name: Produce signed, notarized, stapled artifacts
        if: steps.saved.outputs.restored != 'true'
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          if [[ -z "${CODESIGN_IDENTITY}" ]]; then
            unset CODESIGN_IDENTITY
          fi
          ./Scripts/official-release.sh

      - name: Check installed feed URL and complete artifact bundle
        if: steps.saved.outputs.restored != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test -s "dist/Keyameleon-${VERSION}.dmg"
          test -s dist/appcast.xml
          test -s dist/release-evidence.json
          app_plist="build/official-release/Keyameleon.xcarchive/Products/Applications/Keyameleon.app/Contents/Info.plist"
          installed_feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app_plist")"
          evidence_feed="$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["feedURLString"])')"
          test "$installed_feed" = "$evidence_feed"

      - name: Require complete artifact bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          set -euo pipefail
          test -s "dist/Keyameleon-${VERSION}.dmg"
          test -s dist/appcast.xml
          test -s dist/release-evidence.json
          evidence_commit="$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["gitCommit"])')"
          if [[ "${evidence_commit}" != "${COMMIT}" ]]; then
            echo "saved artifacts name ${evidence_commit}, not version commit ${COMMIT}; dispatch again" >&2
            exit 1
          fi
          test "$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["tag"])')" = "$TAG"
          python3 Scripts/verify-release-appcast.py \
            --appcast dist/appcast.xml --evidence dist/release-evidence.json \
            --artifact "dist/Keyameleon-${VERSION}.dmg"

      - name: Upload workflow artifacts
        if: steps.saved.outputs.restored != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: official-release-${{ needs.verify.outputs.version }}
          path: |
            dist/Keyameleon-${{ needs.verify.outputs.version }}.dmg
            dist/appcast.xml
            dist/release-evidence.json
          if-no-files-found: error

      # The deploy key exists on the runner only after tests, signing, and the
      # artifact checkpoint. Publication scripts come from this fresh checkout.
      - name: Check out publisher with release deploy key
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: publisher
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Write release notes
        working-directory: publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # The notes script excludes TAG if this job is resuming after the tag
          # was created but before the GitHub Release was published.
          CHANGES="$(./Scripts/official-release-notes.sh --tag "$TAG" --head "$HEAD_SHA")"
          printf '%s\n' "$CHANGES" >"$RUNNER_TEMP/release-notes.md"
          printf '\nPermanent release evidence: https://mastro993.github.io/keyameleon/releases/%s/release-evidence.json\n' "$TAG" >>"$RUNNER_TEMP/release-notes.md"

      - name: Push version commit and tag
        working-directory: publisher
        env:
          COMMIT: ${{ steps.bump.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSHED: ${{ steps.bump.outputs.pushed }}
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags "${GITHUB_WORKSPACE}" HEAD
          if [[ "$(git rev-parse FETCH_HEAD)" != "${COMMIT}" ]]; then
            echo "workspace HEAD is not version commit ${COMMIT}" >&2
            exit 1
          fi

          # A stale main stops the publication before any ref or asset exists.
          # The atomic push below rejects a main that advanced before it was
          # sent; a main that advanced after the ref advertisement, when git
          # may send only the tag, is caught by the post-push read.
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}"
          remote_main="$(git rev-parse FETCH_HEAD)"
          if [[ "${PUSHED}" == "true" ]]; then
            expected_main="${COMMIT}"
          else
            expected_main="${SOURCE_SHA}"
          fi
          if [[ "${remote_main}" != "${expected_main}" && "${remote_main}" != "${COMMIT}" ]]; then
            echo "main moved to ${remote_main} before the release push; dispatch again from current main" >&2
            exit 1
          fi

          push_tag=false
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            tagged_commit="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
            if [[ "${tagged_commit}" != "${COMMIT}" ]]; then
              echo "existing tag ${TAG} does not point to the release commit" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${COMMIT}" -m "Keyameleon ${VERSION}"
            push_tag=true
          fi

          if [[ "${push_tag}" == "true" ]]; then
            git push --atomic origin "${COMMIT}:refs/heads/${DEFAULT_BRANCH}" "refs/tags/${TAG}"
            # The atomic push sends the main update with the tag, so a main that
            # advanced before the push rejects both. A concurrent push can still
            # advance main after the ref advertisement, when git may send only
            # the tag; re-read main and remove the tag this step created when
            # main no longer points at the version commit.
            git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}"
            published_main="$(git rev-parse FETCH_HEAD)"
            if [[ "${published_main}" != "${COMMIT}" ]]; then
              git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
              if [[ "$(git rev-parse "refs/tags/${TAG}^{commit}")" == "${COMMIT}" ]]; then
                git push origin ":refs/tags/${TAG}"
              fi
              echo "main moved to ${published_main} while pushing the release tag" >&2
              exit 1
            fi
          elif [[ "${PUSHED}" != "true" && "${remote_main}" != "${COMMIT}" ]]; then
            git push origin "${COMMIT}:refs/heads/${DEFAULT_BRANCH}"
          fi

      - name: Publish and verify downloadable DMG
        working-directory: publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          bash Scripts/publish-official-release-asset.sh \
            "$TAG" "$VERSION" "$RUNNER_TEMP/release-notes.md" \
            "${GITHUB_WORKSPACE}/dist" "$RUNNER_TEMP/release-asset"

      - name: Publish Sparkle appcast and permanent evidence to GitHub Pages
        working-directory: publisher
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash Scripts/publish-release-pages.sh \
            "$TAG" "$COMMIT" "${GITHUB_WORKSPACE}/dist" "$RUNNER_TEMP/release-asset/Keyameleon-${VERSION}.dmg"

      # Installed copies use this feed. Its exact signed bytes must resolve to
      # the already verified public DMG before this job can pass.
      - name: Verify published feed and enclosure
        working-directory: publisher
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          dist="${GITHUB_WORKSPACE}/dist"
          feed_url="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["feedURLString"])' "${dist}/release-evidence.json")"
          archive="Keyameleon-${VERSION}.dmg"
          tag="v${VERSION}"
          evidence_url="https://mastro993.github.io/keyameleon/releases/${tag}/release-evidence.json"
          for attempt in {1..20}; do
            if curl -fsSL -o "$RUNNER_TEMP/published-appcast.xml" "$feed_url" 2>/dev/null && \
              cmp -s "$RUNNER_TEMP/published-appcast.xml" "${dist}/appcast.xml" && \
              curl -fsSL -o "$RUNNER_TEMP/published-evidence.json" "$evidence_url" 2>/dev/null && \
              cmp -s "$RUNNER_TEMP/published-evidence.json" "${dist}/release-evidence.json" && \
              python3 Scripts/verify-release-appcast.py \
                --appcast "$RUNNER_TEMP/published-appcast.xml" \
                --expected-appcast "${dist}/appcast.xml" \
                --evidence "$RUNNER_TEMP/published-evidence.json" \
                --artifact "$RUNNER_TEMP/release-asset/${archive}"; then
              echo "feed ${feed_url} and evidence ${evidence_url} serve verified ${VERSION} enclosure"
              exit 0
            fi
            echo "attempt ${attempt}: ${feed_url} does not serve verified ${VERSION} enclosure yet" >&2
            sleep 6
          done
          echo "feed ${feed_url} does not serve verified ${VERSION} enclosure" >&2
          exit 1
