name: Release

# Only workflow_dispatch on the default branch starts an Official Release.
# The workflow commits the selected version bump to main, then creates the
# annotated tag after artifacts exist. A tag push does not publish.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Official Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_name }}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Official Release only from ${DEFAULT_BRANCH}; got ${{ github.ref_name }}" >&2
            exit 1
          fi
          git fetch origin "${DEFAULT_BRANCH}"
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ "${DISPATCH_SHA}" != "${remote_sha}" ]]; then
            echo "main advanced after dispatch: expected ${DISPATCH_SHA}, got ${remote_sha}" >&2
            exit 1
          fi

      - name: Calculate next Official Release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          VERSION="$(python3 Scripts/release-version.py "${RELEASE_TYPE}")"
          TAG="v${VERSION}"
          ./Scripts/verify-official-release-tag.sh "$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./Scripts/wait-for-ci.sh "${{ github.sha }}"

  bump:
    name: Commit release version
    needs: verify
    runs-on: macos-26
    environment: official-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare version commit
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' Keyameleon.xcodeproj/project.pbxproj project.yml | sort)"
          expected_subject="chore(release): ${VERSION}"
          git fetch origin "${DEFAULT_BRANCH}"
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"

          if [[ "${remote_sha}" != "${SOURCE_SHA}" ]]; then
            remote_parent="$(git log -1 --format=%P "${remote_sha}")"
            remote_subject="$(git log -1 --format=%s "${remote_sha}")"
            remote_files="$(git diff-tree --no-commit-id --name-only -r "${remote_sha}" | sort)"
            if [[ "${remote_parent}" == "${SOURCE_SHA}" && \
                  "${remote_subject}" == "${expected_subject}" && \
                  "${remote_files}" == "${expected_files}" ]]; then
              git checkout --detach "${remote_sha}"
              grep -Fxq "    MARKETING_VERSION: \"${VERSION}\"" project.yml
              echo "commit=${remote_sha}" >> "$GITHUB_OUTPUT"
              echo "reused=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main changed before the release bump; dispatch again from current main" >&2
            exit 1
          fi

          artifact_count="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | jq --arg name "official-release-${VERSION}" '[.[].artifacts[] | select(.name == $name)] | length')"
          test "${artifact_count}" = 0
          remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}")"
          test -z "${remote_tag}"
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == "'"${TAG}"'") | .id')"
          test -z "${release_id}"

          calculated="$(python3 Scripts/release-version.py "${RELEASE_TYPE}" --write)"
          if [[ "${calculated}" != "${VERSION}" ]]; then
            echo "release version changed: expected ${VERSION}, got ${calculated}" >&2
            exit 1
          fi

          xcodegen generate --spec project.yml
          git diff --check
          changed_files="$(git diff --name-only | sort)"
          if [[ "${changed_files}" != "${expected_files}" ]]; then
            echo "unexpected release-bump files:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml Keyameleon.xcodeproj/project.pbxproj
          git commit -m "chore(release): ${VERSION}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "reused=false" >> "$GITHUB_OUTPUT"

      - name: Push version commit to main
        if: steps.bump.outputs.reused != 'true'
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"

  produce:
    name: Produce release artifacts
    needs: verify
    runs-on: macos-26
    environment: official-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for validated version commit
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          expected_files="$(printf '%s\n' Keyameleon.xcodeproj/project.pbxproj project.yml | sort)"
          for attempt in {1..180}; do
            git fetch origin "${DEFAULT_BRANCH}"
            remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
            if [[ "${remote_sha}" != "${SOURCE_SHA}" ]]; then
              test "$(git log -1 --format=%P "${remote_sha}")" = "${SOURCE_SHA}"
              test "$(git log -1 --format=%s "${remote_sha}")" = "chore(release): ${VERSION}"
              test "$(git diff-tree --no-commit-id --name-only -r "${remote_sha}" | sort)" = "${expected_files}"
              git show "${remote_sha}:project.yml" | grep -Fxq "    MARKETING_VERSION: \"${VERSION}\""
              echo "commit=${remote_sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt ${attempt}: waiting for the release bump on main" >&2
            sleep 10
          done
          echo "timed out waiting for the release bump on main" >&2
          exit 1

      - name: Checkout validated version commit
        env:
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: git checkout --detach "$COMMIT"

      - name: Restore saved release artifacts on retry
        id: saved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          artifact_name="official-release-${VERSION}"
          artifact_id="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            | jq -r --arg name "${artifact_name}" '[.[].artifacts[] | select(.name == $name)] |
              if length == 0 then ""
              elif length != 1 or .[0].expired then error("saved release artifact is ambiguous or expired")
              else .[0].id end')"
          if [[ -n "${artifact_id}" ]]; then
            gh run download "${GITHUB_RUN_ID}" --name "${artifact_name}" --dir dist
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}")"
            test -z "${remote_tag}"
            release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.tag_name == "'"${TAG}"'") | .id')"
            test -z "${release_id}"
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.saved.outputs.restored != 'true'
        run: brew install xcodegen

      - name: Install SwiftLint 0.65.1
        if: steps.saved.outputs.restored != 'true'
        run: |
          set -euo pipefail
          swiftlint_dir="${RUNNER_TEMP}/swiftlint"
          mkdir -p "${swiftlint_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            -o "${swiftlint_dir}/swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  ${swiftlint_dir}/swiftlint.zip" \
            | shasum -a 256 --check
          unzip -q "${swiftlint_dir}/swiftlint.zip" -d "${swiftlint_dir}"
          echo "${swiftlint_dir}" >> "${GITHUB_PATH}"

      - name: Test version commit
        if: steps.saved.outputs.restored != 'true'
        run: |
          ./Scripts/run.sh test
          git diff --exit-code

      - name: Produce signed, notarized, stapled artifacts
        if: steps.saved.outputs.restored != 'true'
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          if [[ -z "${CODESIGN_IDENTITY}" ]]; then
            unset CODESIGN_IDENTITY
          fi
          ./Scripts/official-release.sh

      - name: Check installed feed URL and complete artifact bundle
        if: steps.saved.outputs.restored != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test -s "dist/Keyameleon-${VERSION}.dmg"
          test -s dist/appcast.xml
          test -s dist/release-evidence.json
          app_plist="build/official-release/Keyameleon.xcarchive/Products/Applications/Keyameleon.app/Contents/Info.plist"
          installed_feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app_plist")"
          evidence_feed="$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["feedURLString"])')"
          test "$installed_feed" = "$evidence_feed"

      - name: Require complete artifact bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          set -euo pipefail
          test -s "dist/Keyameleon-${VERSION}.dmg"
          test -s dist/appcast.xml
          test -s dist/release-evidence.json
          test "$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["gitCommit"])')" = "$COMMIT"
          test "$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["tag"])')" = "$TAG"
          python3 Scripts/verify-release-appcast.py \
            --appcast dist/appcast.xml --evidence dist/release-evidence.json \
            --artifact "dist/Keyameleon-${VERSION}.dmg"

      - name: Upload workflow artifacts
        if: steps.saved.outputs.restored != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: official-release-${{ needs.verify.outputs.version }}
          path: |
            dist/Keyameleon-${{ needs.verify.outputs.version }}.dmg
            dist/appcast.xml
            dist/release-evidence.json
          if-no-files-found: error

  publish:
    name: Publish Official Release
    needs: verify
    runs-on: ubuntu-latest
    environment: official-release
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Wait for saved release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          artifact_name="official-release-${VERSION}"
          for attempt in {1..180}; do
            artifact_id="$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              | jq -r --arg name "${artifact_name}" '[.[].artifacts[] | select(.name == $name)] |
                if length == 0 then ""
                elif length != 1 or .[0].expired then error("saved release artifact is ambiguous or expired")
                else .[0].id end')"
            if [[ -n "${artifact_id}" ]]; then
              gh run download "${GITHUB_RUN_ID}" --name "${artifact_name}" --dir dist
              exit 0
            fi
            echo "attempt ${attempt}: waiting for the saved release artifact" >&2
            sleep 30
          done
          echo "timed out waiting for the saved release artifact" >&2
          exit 1

      - name: Validate published version commit
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          test "$(git log -1 --format=%P "${remote_sha}")" = "${SOURCE_SHA}"
          test "$(git log -1 --format=%s "${remote_sha}")" = "chore(release): ${VERSION}"
          expected_files="$(printf '%s\n' Keyameleon.xcodeproj/project.pbxproj project.yml | sort)"
          test "$(git diff-tree --no-commit-id --name-only -r "${remote_sha}" | sort)" = "${expected_files}"
          git show "${remote_sha}:project.yml" | grep -Fxq "    MARKETING_VERSION: \"${VERSION}\""
          echo "commit=${remote_sha}" >> "$GITHUB_OUTPUT"

      - name: Require complete artifact bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          set -euo pipefail
          test -s "dist/Keyameleon-${VERSION}.dmg"
          test -s dist/appcast.xml
          test -s dist/release-evidence.json
          test "$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["gitCommit"])')" = "$COMMIT"
          test "$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["tag"])')" = "$TAG"
          python3 Scripts/verify-release-appcast.py \
            --appcast dist/appcast.xml --evidence dist/release-evidence.json \
            --artifact "dist/Keyameleon-${VERSION}.dmg"

      - name: Prepare Official Release tag and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: |
          set -euo pipefail
          # The notes script excludes TAG if this job is resuming after the tag
          # was created but before the GitHub Release was published.
          CHANGES="$(./Scripts/official-release-notes.sh --tag "$TAG" --head "${{ github.sha }}")"
          printf '%s\n' "$CHANGES" >"$RUNNER_TEMP/release-notes.md"
          printf '\nPermanent release evidence: https://mastro993.github.io/keyameleon/releases/%s/release-evidence.json\n' "$TAG" >>"$RUNNER_TEMP/release-notes.md"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            tagged_commit="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
            if [[ "${tagged_commit}" != "$COMMIT" ]]; then
              echo "existing tag ${TAG} does not point to the release commit" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$COMMIT" -m "Keyameleon ${VERSION}"
            git push origin "$TAG"
          fi

      - name: Publish and verify downloadable DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          bash Scripts/publish-official-release-asset.sh \
            "$TAG" "$VERSION" "$RUNNER_TEMP/release-notes.md" \
            dist "$RUNNER_TEMP/release-asset"

      - name: Publish Sparkle appcast and permanent evidence to GitHub Pages
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash Scripts/publish-release-pages.sh \
            "$TAG" "$COMMIT" dist "$RUNNER_TEMP/release-asset/Keyameleon-${VERSION}.dmg"

      # Installed copies use this feed. Its exact signed bytes must resolve to
      # the already verified public DMG before this job can pass.
      - name: Verify published feed and enclosure
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          feed_url="$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["feedURLString"])')"
          archive="Keyameleon-${VERSION}.dmg"
          tag="v${VERSION}"
          evidence_url="https://mastro993.github.io/keyameleon/releases/${tag}/release-evidence.json"
          for attempt in {1..20}; do
            if curl -fsSL -o "$RUNNER_TEMP/published-appcast.xml" "$feed_url" 2>/dev/null && \
              cmp -s "$RUNNER_TEMP/published-appcast.xml" dist/appcast.xml && \
              curl -fsSL -o "$RUNNER_TEMP/published-evidence.json" "$evidence_url" 2>/dev/null && \
              cmp -s "$RUNNER_TEMP/published-evidence.json" dist/release-evidence.json && \
              python3 Scripts/verify-release-appcast.py \
                --appcast "$RUNNER_TEMP/published-appcast.xml" \
                --expected-appcast dist/appcast.xml \
                --evidence "$RUNNER_TEMP/published-evidence.json" \
                --artifact "$RUNNER_TEMP/release-asset/${archive}"; then
              echo "feed ${feed_url} and evidence ${evidence_url} serve verified ${VERSION} enclosure"
              exit 0
            fi
            echo "attempt ${attempt}: ${feed_url} does not serve verified ${VERSION} enclosure yet" >&2
            sleep 6
          done
          echo "feed ${feed_url} does not serve verified ${VERSION} enclosure" >&2
          exit 1

      # The tap deploy key can write only to mastro993/homebrew-tap.
      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: mastro993/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Publish Homebrew cask
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash Scripts/publish-homebrew-cask.sh homebrew-tap "$VERSION" \
            "$RUNNER_TEMP/release-asset/Keyameleon-${VERSION}.dmg"
