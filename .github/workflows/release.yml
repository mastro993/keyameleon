name: Release

# Only workflow_dispatch on the default branch starts an Official Release.
# The workflow commits the selected version bump to main, then creates the
# annotated tag after artifacts exist. A tag push does not publish.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Official Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_name }}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Official Release only from ${DEFAULT_BRANCH}; got ${{ github.ref_name }}" >&2
            exit 1
          fi
          git fetch origin "${DEFAULT_BRANCH}"
          remote_sha="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          if [[ "${DISPATCH_SHA}" != "${remote_sha}" ]]; then
            echo "main advanced after dispatch: expected ${DISPATCH_SHA}, got ${remote_sha}" >&2
            exit 1
          fi

      - name: Calculate next Official Release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          VERSION="$(python3 Scripts/release-version.py "${RELEASE_TYPE}")"
          TAG="v${VERSION}"
          ./Scripts/verify-official-release-tag.sh "$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./Scripts/wait-for-ci.sh "${{ github.sha }}"

  bump:
    name: Commit release version
    needs: verify
    runs-on: macos-26
    environment: official-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare version commit
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash Scripts/prepare-release-bump.sh

      - name: Push version commit to main
        if: steps.bump.outputs.reused != 'true'
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"

  produce:
    name: Produce release artifacts
    needs: verify
    runs-on: macos-26
    environment: official-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for validated version commit
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash Scripts/wait-for-release-bump.sh

      - name: Checkout validated version commit
        env:
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: git checkout --detach "$COMMIT"

      - name: Restore saved release artifacts on retry
        id: saved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: bash Scripts/restore-release-artifacts.sh

      - name: Install XcodeGen
        if: steps.saved.outputs.restored != 'true'
        run: brew install xcodegen

      - name: Install SwiftLint 0.65.1
        if: steps.saved.outputs.restored != 'true'
        run: |
          set -euo pipefail
          swiftlint_dir="${RUNNER_TEMP}/swiftlint"
          mkdir -p "${swiftlint_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            -o "${swiftlint_dir}/swiftlint.zip"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  ${swiftlint_dir}/swiftlint.zip" \
            | shasum -a 256 --check
          unzip -q "${swiftlint_dir}/swiftlint.zip" -d "${swiftlint_dir}"
          echo "${swiftlint_dir}" >> "${GITHUB_PATH}"

      - name: Test version commit
        if: steps.saved.outputs.restored != 'true'
        run: |
          ./Scripts/run.sh test
          git diff --exit-code

      - name: Produce signed, notarized, stapled artifacts
        if: steps.saved.outputs.restored != 'true'
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          if [[ -z "${CODESIGN_IDENTITY}" ]]; then
            unset CODESIGN_IDENTITY
          fi
          ./Scripts/official-release.sh

      - name: Check installed feed URL and complete artifact bundle
        if: steps.saved.outputs.restored != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          test -s "dist/Keyameleon-${VERSION}.dmg"
          test -s dist/appcast.xml
          test -s dist/release-evidence.json
          app_plist="build/official-release/Keyameleon.xcarchive/Products/Applications/Keyameleon.app/Contents/Info.plist"
          installed_feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app_plist")"
          evidence_feed="$(python3 -c 'import json; print(json.load(open("dist/release-evidence.json"))["feedURLString"])')"
          test "$installed_feed" = "$evidence_feed"

      - name: Require complete artifact bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: bash Scripts/verify-release-bundle.sh

      - name: Upload workflow artifacts
        if: steps.saved.outputs.restored != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: official-release-${{ needs.verify.outputs.version }}
          path: |
            dist/Keyameleon-${{ needs.verify.outputs.version }}.dmg
            dist/appcast.xml
            dist/release-evidence.json
          if-no-files-found: error

  publish:
    name: Publish Official Release
    needs: verify
    runs-on: ubuntu-latest
    environment: official-release
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Wait for saved release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash Scripts/wait-for-release-artifacts.sh

      - name: Validate published version commit
        id: bump
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash Scripts/verify-release-bump.sh

      - name: Require complete artifact bundle
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
        run: bash Scripts/verify-release-bundle.sh

      - name: Prepare Official Release tag and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash Scripts/tag-official-release.sh

      - name: Publish and verify downloadable DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          bash Scripts/publish-official-release-asset.sh \
            "$TAG" "$VERSION" "$RUNNER_TEMP/release-notes.md" \
            dist "$RUNNER_TEMP/release-asset"

      - name: Publish Sparkle appcast and permanent evidence to GitHub Pages
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash Scripts/publish-release-pages.sh \
            "$TAG" "$COMMIT" dist "$RUNNER_TEMP/release-asset/Keyameleon-${VERSION}.dmg"

      # Installed copies use this feed. Its exact signed bytes must resolve to
      # the already verified public DMG before this job can pass.
      - name: Verify published feed and enclosure
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash Scripts/verify-published-release.sh

      # The tap deploy key can write only to mastro993/homebrew-tap.
      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: mastro993/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Publish Homebrew cask
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash Scripts/publish-homebrew-cask.sh homebrew-tap "$VERSION" \
            "$RUNNER_TEMP/release-asset/Keyameleon-${VERSION}.dmg"

      # keyameleon.app prerenders the latest release at build time, so its HTML
      # picks up this version only after a rebuild. A separate `on: release`
      # workflow never runs, because this job publishes with GITHUB_TOKEN. The
      # secret is a Cloudflare Workers Builds deploy hook URL; never print it.
      - name: Rebuild keyameleon.app
        continue-on-error: true # A site rebuild must never fail a release.
        env:
          DEPLOY_HOOK: ${{ secrets.KEYAMELEON_WEB_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOOK}" ]]; then
            echo "::warning::KEYAMELEON_WEB_DEPLOY_HOOK is not set; skipping the site rebuild."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "${DEPLOY_HOOK}"
