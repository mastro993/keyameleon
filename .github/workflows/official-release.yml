name: Official Release

# Only workflow_dispatch on the default branch starts an Official Release.
# The annotated tag is created after artifacts exist. A tag push does not publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic Versioning core (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Official Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require default branch
        run: |
          set -euo pipefail
          default="${{ github.event.repository.default_branch }}"
          if [[ "${{ github.ref_name }}" != "${default}" ]]; then
            echo "Official Release only from ${default}; got ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Reject used or invalid Official Release version
        id: version
        run: |
          set -euo pipefail
          chmod +x Scripts/*.sh
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          ./Scripts/verify-official-release-tag.sh "$TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          conclusions="$(gh run list \
            --workflow CI \
            --commit "$SHA" \
            --json conclusion,status \
            --jq '.[] | select(.status=="completed") | .conclusion')"
          if ! grep -qx success <<<"$conclusions"; then
            echo "no successful CI run for ${SHA}" >&2
            echo "${conclusions:-<none>}" >&2
            exit 1
          fi

  produce:
    name: Produce Official Release artifacts
    needs: verify
    runs-on: macos-26
    environment: official-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject published Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.verify.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Produce signed, notarized, stapled artifacts
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          chmod +x Scripts/*.sh
          if [[ -z "${CODESIGN_IDENTITY}" ]]; then
            unset CODESIGN_IDENTITY
          fi
          ./Scripts/official-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-release-${{ needs.verify.outputs.version }}
          path: |
            dist/Keyameleon-*.zip
            dist/Keyameleon-source-*.tar.gz
            dist/appcast.xml
            dist/release-evidence.json
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x Scripts/*.sh
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official Release already exists: ${TAG}" >&2
            exit 1
          fi

          # Notes before the new tag exists so the previous Official Release is still previous.
          CHANGES="$(./Scripts/official-release-notes.sh)"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Keyameleon ${VERSION}"
            git push origin "$TAG"
          fi

          ARCHIVE="dist/Keyameleon-${VERSION}.zip"
          SOURCE="dist/Keyameleon-source-${VERSION}.tar.gz"
          APPCAST="dist/appcast.xml"
          EVIDENCE="dist/release-evidence.json"
          NOTES="$(mktemp)"
          {
            echo "## Keyameleon ${VERSION}"
            echo
            echo "Official Release of Keyameleon under \`GPL-3.0-only\`."
            echo
            echo "### Changes"
            echo
            printf '%s\n' "$CHANGES"
            echo
            echo "### Artifacts"
            echo
            echo "- Signed, hardened-runtime, notarized, and stapled application archive"
            echo "- Source archive at tag \`${TAG}\`"
            echo "- Sparkle \`appcast.xml\` for user-approved updates"
            echo "- \`release-evidence.json\` binding the artifact SHA-256 to this source tag"
            echo
            echo "### Supported Release"
            echo
            echo "The latest Official Release is the only Supported Release."
            echo
            echo "### Verify"
            echo
            echo '```sh'
            echo "shasum -a 256 -c <(jq -r '\"\\(.artifactSHA256)  \\(.artifactFileName)\"' release-evidence.json)"
            echo '```'
          } >"$NOTES"

          gh release create "$TAG" \
            "$ARCHIVE" \
            "$SOURCE" \
            "$APPCAST" \
            "$EVIDENCE" \
            --title "Keyameleon ${VERSION}" \
            --notes-file "$NOTES" \
            --verify-tag
