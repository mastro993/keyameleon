name: Official Release

# Only a protected Semantic Versioning tag starts an Official Release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: official-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify Official Release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Reject non-SemVer-core tags
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(./Scripts/verify-official-release-tag.sh "$TAG")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Official Release tag ${TAG} -> ${VERSION}"

  produce:
    name: Produce Official Release artifacts
    needs: verify-tag
    runs-on: macos-15
    environment: official-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Produce signed, notarized, stapled artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          CODESIGN_IDENTITY: ${{ vars.CODESIGN_IDENTITY }}
        run: |
          chmod +x Scripts/*.sh
          if [[ -z "${CODESIGN_IDENTITY}" ]]; then
            unset CODESIGN_IDENTITY
          fi
          ./Scripts/official-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-release-${{ needs.verify-tag.outputs.version }}
          path: |
            dist/Keyameleon-*.zip
            dist/Keyameleon-source-*.tar.gz
            dist/appcast.xml
            dist/release-evidence.json
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/Keyameleon-${VERSION}.zip"
          SOURCE="dist/Keyameleon-source-${VERSION}.tar.gz"
          APPCAST="dist/appcast.xml"
          EVIDENCE="dist/release-evidence.json"
          NOTES="$(mktemp)"
          {
            echo "## Keyameleon ${VERSION}"
            echo
            echo "Official Release of Keyameleon under \`GPL-3.0-only\`."
            echo
            echo "### Artifacts"
            echo
            echo "- Signed, hardened-runtime, notarized, and stapled application archive"
            echo "- Source archive at tag \`${TAG}\`"
            echo "- Sparkle \`appcast.xml\` for user-approved updates"
            echo "- \`release-evidence.json\` binding the artifact SHA-256 to this source tag"
            echo
            echo "### Supported Release"
            echo
            echo "The latest Official Release is the only Supported Release."
            echo
            echo "### Verify"
            echo
            echo '```sh'
            echo "shasum -a 256 -c <(jq -r '\"\\(.artifactSHA256)  \\(.artifactFileName)\"' release-evidence.json)"
            echo '```'
          } >"$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$ARCHIVE" \
              "$SOURCE" \
              "$APPCAST" \
              "$EVIDENCE" \
              --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              "$ARCHIVE" \
              "$SOURCE" \
              "$APPCAST" \
              "$EVIDENCE" \
              --title "Keyameleon ${VERSION}" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
