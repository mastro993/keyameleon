name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on each commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r commit; do
            body="$(git log -1 --format=%B "$commit")"
            if ! grep -qiE '^Signed-off-by: .+ <.+@.+>$' <<<"$body"; then
              echo "missing DCO sign-off: $commit"
              git log -1 --oneline "$commit"
              failed=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          if [[ "$failed" -ne 0 ]]; then
            echo
            echo "Each commit needs a Developer Certificate of Origin sign-off:"
            echo "  git commit -s"
            echo "See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits carry Signed-off-by."
