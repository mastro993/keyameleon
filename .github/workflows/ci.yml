name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build application
        run: ./Scripts/run.sh build

      - name: Run tests
        run: ./Scripts/run.sh test
