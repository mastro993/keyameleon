name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      macos_required: ${{ steps.changes.outputs.macos_required }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether code changed
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          macos_required=false
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            macos_required=true
          elif ! git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- \
            Sources \
            Scripts \
            Tests/Scripts \
            Tests/SwiftTesting \
            Tests/XCTest \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            Keyameleon.xcodeproj \
            project.yml \
            Package.swift \
            Package.resolved; then
            macos_required=true
          fi
          echo "macos_required=${macos_required}" >> "${GITHUB_OUTPUT}"

  macos:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.macos_required == 'true'
    runs-on: macos-26
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Read Xcode cache key
        id: xcode
        run: |
          version="$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache Swift package sources
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: swift-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('Keyameleon.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Run tests and safety audit
        run: ./Scripts/run.sh test

  required:
    name: Required CI gate
    needs:
      - changes
      - macos
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require selected checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_REQUIRED: ${{ needs.changes.outputs.macos_required }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          test "${CHANGES_RESULT}" = "success"
          if [[ "${MACOS_REQUIRED}" == "true" ]]; then
            test "${MACOS_RESULT}" = "success"
          else
            test "${MACOS_RESULT}" = "skipped"
          fi
