name: Feature request
description: Suggest an idea or improvement for Keyameleon
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Keyameleon. Larger changes, new features, and UI changes are agreed here before a pull request is opened.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
      placeholder: Describe the limitation or frustration you are experiencing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Keyameleon to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, mockups, examples, or any other useful context.
